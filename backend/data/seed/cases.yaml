# Synthetic demo cases. Facts are written directly (no LLM needed to seed), then
# each case is pushed through the real workflows to the stage named in `stop_at`.
#   stop_at: intake | prescreen | review | notes | finalize
cases:
  - key: high_chest_pain
    mrn: MRN-10021
    stop_at: prescreen
    transcript:
      - [patient, "I've been having a tight chest pain since this morning. It comes and goes."]
      - [assistant, "I'm sorry to hear that. How long has the chest pain been going on?"]
      - [patient, "Since about 7am today, so a few hours."]
      - [assistant, "How would you like the clinic to contact you?"]
      - [patient, "Phone, please."]
    facts:
      - [reason_for_visit, "chest pain", 0]
      - [symptom, "tight chest pain that comes and goes", 0]
      - [duration, "a few hours", 2]
      - [contact_preference, "phone", 4]

  - key: medium_cough
    mrn: MRN-10022
    stop_at: review
    review: {decision: approve, reviewer_id: dr_iyer, reviewer_role: doctor}
    transcript:
      - [patient, "I have had a persistent cough for about three weeks now."]
      - [assistant, "Thank you. Is there anything else you've noticed alongside the cough?"]
      - [patient, "Some wheezing at night. I use my inhaler as usual."]
      - [assistant, "How should we contact you?"]
      - [patient, "Email is best."]
    facts:
      - [reason_for_visit, "persistent cough", 0]
      - [symptom, "persistent cough", 0]
      - [duration, "about three weeks", 0]
      - [symptom, "wheezing at night", 2]
      - [contact_preference, "email", 4]

  - key: allergy_conflict
    mrn: MRN-10023
    stop_at: prescreen
    transcript:
      - [patient, "I've had a fever and a sore throat for two days and I'd like to be seen."]
      - [assistant, "Understood. Which medications are you currently taking?"]
      - [patient, "Metformin, and I started amoxicillin yesterday from a pharmacy."]
      - [assistant, "Do you have any allergies?"]
      - [patient, "I'm allergic to amoxicillin, I think it gave me a rash before."]
      - [assistant, "How should the clinic contact you?"]
      - [patient, "Phone."]
    facts:
      - [reason_for_visit, "fever and sore throat", 0]
      - [symptom, "fever", 0]
      - [symptom, "sore throat", 0]
      - [duration, "two days", 0]
      - [contact_preference, "phone", 6]
    entries:
      - [medication, "amoxicillin", "started yesterday", 2]
      - [allergy, "amoxicillin", "rash", 4]

  - key: low_rash_completed
    mrn: MRN-10025
    stop_at: finalize
    review: {decision: edit, reviewer_id: dr_kaur, reviewer_role: doctor, edits: {reported_symptoms: "itchy rash on both forearms, no blistering"}}
    note:
      doctor_id: dr_kaur
      consultation_mode: virtual
      notes: "Mild contact dermatitis pattern on both forearms consistent with the new detergent the patient mentioned. No systemic features."
      prescription: "Emollient cream twice daily for 7 days."
      follow_up_instructions: "Return if the rash spreads, blisters, or is not improving in 10 days."
    transcript:
      - [patient, "I've got an itchy rash on my arms, started about four days ago after I changed washing powder."]
      - [assistant, "Thanks for letting me know. How would you like us to contact you?"]
      - [patient, "Text message please."]
    facts:
      - [reason_for_visit, "itchy rash on arms", 0]
      - [symptom, "itchy rash on both forearms", 0]
      - [duration, "about four days", 0]
      - [contact_preference, "text message", 2]

  - key: incomplete_walkin
    stop_at: intake
    transcript:
      - [patient, "Hi, I'd like to see someone about my knee. It's been sore."]
      - [assistant, "Of course. How long has your knee been sore?"]
    facts:
      - [reason_for_visit, "sore knee", 0]
      - [symptom, "knee pain", 0]
    demographics: {name: "Sunil Verma", age: "41", sex: "male"}