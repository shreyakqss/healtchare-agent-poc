triage_rules:
  version: 2026.08.1
  rules:
  - code: TR-HIGH-001
    priority: high
    condition:
      any_symptom:
      - chest pain
      - chest tightness
      - shortness of breath
      - breathlessness
      - severe bleeding
      - fainting
      - loss of consciousness
    action: Route to an urgent same-day slot and flag for immediate staff attention.
    explanation: The patient reported a symptom the clinic has designated for same-day
      administrative escalation.
    specialty_hint: cardiology
  - code: TR-HIGH-002
    priority: high
    condition:
      allergy_conflict: true
    action: Flag the allergy and medication conflict for clinician attention before
      any appointment is confirmed.
    explanation: A reported allergy overlaps with a reported current medication, which
      the clinic always escalates for human review.
  - code: TR-MED-001
    priority: medium
    condition:
      min_duration_days: 14
    action: Offer an in-person consultation within the week.
    explanation: The reported symptom duration exceeds the clinic's two-week threshold
      for a prompt in-person review.
  - code: TR-MED-002
    priority: medium
    condition:
      any_symptom:
      - fever
      - persistent cough
      - vomiting
      - dizziness
      any_history:
      - diabetes
      - hypertension
      - asthma
      - immunocompromised
    action: Offer an in-person consultation within the week.
    explanation: A reported symptom combined with an existing condition on the clinic's
      watch list warrants a prompt review.
  - code: TR-LOW-000
    priority: low
    condition: {}
    action: Offer a routine consultation at the next available slot.
    explanation: No rule for elevated administrative urgency matched, so the case
      follows the standard routine pathway.
priority_appointment_map:
  high: urgent_slot
  medium: in_person_consult
  low: routine_followup
