# Postgres only. The backend, frontend, and Ollama run on the host for fast
# iteration during Phase 1.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
