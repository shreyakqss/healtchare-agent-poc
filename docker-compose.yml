# Postgres, OpenEMR (+ its own MariaDB), and Keycloak; backend/frontend run on the host. See README.md setup.
name: healthcare-agent-poc  # pins container prefix regardless of checkout folder name
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-Careflow@2026}
      POSTGRES_DB: healthcare_agent
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthcare_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OpenEMR requires its own MySQL/MariaDB - it does NOT share the Postgres `db` service.
  openemr-mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${OPENEMR_DB_ROOT_PASSWORD:-Careflow@2026}
      MYSQL_DATABASE: openemr
      MYSQL_USER: openemr
      MYSQL_PASSWORD: ${OPENEMR_DB_PASSWORD:-Careflow@2026}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - openemr_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  openemr:
    # 8.3.0 is the current stable release (openemr/downloads, checked Aug 2026).
    image: openemr/openemr:8.3.0
    depends_on:
      openemr-mariadb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8300:80"
      - "127.0.0.1:8443:443"
    environment:
      MYSQL_HOST: openemr-mariadb
      MYSQL_ROOT_PASS: ${OPENEMR_DB_ROOT_PASSWORD:-Careflow@2026}
      MYSQL_USER: openemr
      MYSQL_PASS: ${OPENEMR_DB_PASSWORD:-Careflow@2026}
      MYSQL_DATABASE: openemr
      OE_USER: admin
      OE_PASS: ${OPENEMR_ADMIN_PASSWORD:-Careflow@2026}  # only applies on a fresh install; change via OpenEMR UI after
      # These flags enable REST/FHIR + OAuth2 password grant on first boot (values from OpenEMR's own example).
      OPENEMR_SETTING_rest_api: "1"
      OPENEMR_SETTING_rest_fhir_api: "1"
      OPENEMR_SETTING_rest_system_scopes_api: "1"
      OPENEMR_SETTING_oauth_password_grant: "3"
      OPENEMR_SETTING_ccda_alt_service_enable: "3"
      OPENEMR_SETTING_site_addr_oath: "http://localhost:8300"  # "oath" is OpenEMR's own spelling, not a typo
    volumes:
      - openemr_sites:/var/www/localhost/htdocs/openemr/sites

  keycloak-db:
    image: postgres:16
    profiles: ["auth"]
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-Careflow@2026}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    profiles: ["auth"]
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8500:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-Careflow@2026}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Careflow@2026}
      KC_HOSTNAME: http://localhost:8500
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro

  # Self-hosted agent tracing
  langfuse-postgres:
    image: postgres:17
    profiles: ["tracing"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-Careflow@2026}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - langfuse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: ["tracing"]
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-Careflow2026}
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    # minio/minio is no longer published on Docker Hub; Chainguard's build ships minio + mc.
    image: cgr.dev/chainguard/minio:latest
    profiles: ["tracing"]
    user: root
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-Careflow@2026}
    ports:
      - "127.0.0.1:9090:9000"
      - "127.0.0.1:9091:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-redis:
    image: redis:7
    profiles: ["tracing"]
    command: >
      --requirepass ${LANGFUSE_REDIS_PASSWORD:-Careflow@2026}
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: ["tracing"]
    depends_on: &langfuse-depends-on
      langfuse-postgres:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:2000
      DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD:-Careflow%402026}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT:-Careflow@2026}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-db1cf72ec159c756dcfce5a0f011807629edf8361c4b3abdd89b23f0a459e5c8} # generate your own via `openssl rand -hex 32`
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-Careflow2026}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-Careflow@2026}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-Careflow@2026}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-Careflow@2026}

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: ["tracing"]
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:2000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-Careflow@2026}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090

volumes:
  pgdata:
  openemr_mariadb_data:
  openemr_sites:
  keycloak_pgdata:
  langfuse_pgdata:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
